<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmazonIntelligence · 竞争情报监控系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="dashboard-data.js"></script>
<style>
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f1f5f9}
  .nav-group-label{font-size:10.5px;letter-spacing:.08em;color:#64748b;font-weight:700;padding:14px 12px 4px}
  .nav-item{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:13px;color:#475569;border-radius:8px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left}
  .nav-item:hover{background:#eef2ff;color:#4f46e5}
  .nav-item.active{background:#4f46e5;color:#fff;font-weight:600}
  .page{display:none}
  .page.active{display:block;animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1}}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .stat-label{font-size:12px;color:#64748b}
  .stat-val{font-size:22px;font-weight:800;color:#0f172a}
  .stat-sub{font-size:11px;color:#94a3b8}
  .pill{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600}
  .pill-p1{background:#fee2e2;color:#dc2626}
  .pill-p2{background:#fef3c7;color:#d97706}
  .pill-ok{background:#dcfce7;color:#16a34a}
  .pill-gray{background:#f1f5f9;color:#64748b}
  .pill-blue{background:#dbeafe;color:#2563eb}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#64748b;font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid #e2e8f0;white-space:nowrap}
  td{font-size:12.5px;padding:8px 10px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle}
  tr:hover td{background:#f8fafc}
  .src-tag{font-size:10px;color:#94a3b8;font-family:ui-monospace,Consolas,monospace}
  .btn{border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:5px 12px;font-size:12.5px;color:#334155;cursor:pointer}
  .btn:hover{background:#f8fafc;border-color:#cbd5e1}
  .btn-primary{background:#4f46e5;border-color:#4f46e5;color:#fff}
  .btn-primary:hover{background:#4338ca}
  .btn-sm{padding:3px 10px;font-size:12px;border-radius:6px}
  .rankcell{font-weight:600}
  .rk1{color:#dc2626}.rk2{color:#d97706}.rk3{color:#2563eb}.rk4{color:#16a34a}.rk5{color:#7c3aed}
  input[type=search],input[type=text],select{border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:12.5px;outline:none}
  input:focus,select:focus{border-color:#4f46e5;box-shadow:0 0 0 2px rgba(79,70,229,.12)}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
  .toast{position:fixed;bottom:24px;right:24px;z-index:50}
  .badge-count{background:#ef4444;color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:15px}
</style>
</head>
<body>
<div class="flex h-screen overflow-hidden">

  <aside class="w-56 bg-white border-r border-slate-200 flex flex-col shrink-0">
    <div class="px-4 py-4 border-b border-slate-100">
      <div class="text-[13px] font-extrabold text-slate-900 leading-tight">Amazon<span class="text-indigo-600">Intelligence</span></div>
      <div class="text-[10.5px] text-slate-400">竞争情报监控系统</div>
    </div>
    <nav id="sidebar" class="flex-1 overflow-y-auto px-2 pb-4"></nav>
    <div class="px-3 py-3 border-t border-slate-100">
      <a href="https://www.sorftime.com?tag=ODI4OA%7E%7E" target="_blank" rel="noopener"
         class="block rounded-lg border border-slate-100 bg-slate-50 hover:bg-indigo-50 transition-colors px-2.5 py-2 no-underline">
        <div class="text-[10.5px] font-bold text-slate-700">数据源 · Sorftime</div>
        <div class="text-[10px] text-slate-500 mt-0.5 leading-snug">专属续费通道（含 7 天试用）</div>
        <div class="text-[10px] font-semibold text-indigo-600 mt-0.5">优惠码：8288 ›</div>
      </a>
    </div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white border-b border-slate-200 px-5 py-2.5 flex items-center gap-3 shrink-0">
      <div class="flex items-center gap-2 text-[13px] font-semibold text-slate-700">
        <span class="text-slate-400">监控项目</span>
        <span id="hd-project" class="text-slate-900">…</span>
      </div>
      <span class="pill pill-gray">候选待核验 <span id="hd-cand">0</span></span>
      <span class="pill pill-gray">站点：<span id="hd-site">US</span></span>
      <span class="pill pill-ok">状态：<span id="hd-status">ready</span></span>
      <span class="ml-auto text-[11px] text-slate-400 src-tag" id="hd-cap"></span>
      <button class="btn btn-sm" onclick="location.reload()">⟳ 刷新</button>
    </header>
    <main class="flex-1 overflow-y-auto p-5">
      <div id="page-root"></div>
    </main>
  </div>
</div>
<div id="toast-wrap" class="toast space-y-2"></div>

<script>
"use strict";
/* ==================== 数据与常量 ==================== */
const D = window.MONITOR_DATA;
const ASIN_META = {};
D.asins.forEach(a => { ASIN_META[a.asin] = a; });
const BRAND_SHORT = {};
Object.entries(D.per_asin||{}).forEach(([a,k])=>{ BRAND_SHORT[a]=k.name||a; });
const MAIN_ASIN = D.meta.main_asin || (D.asins[0]&&D.asins[0].asin);
const ASIN_ORDER = [MAIN_ASIN].concat(D.asins.filter(a=>a.asin!==MAIN_ASIN).map(a=>a.asin));
const RL = (D.totals&&D.totals.request_left)||'--';
const N_ASIN = D.asins.length;
const N_COMP = Math.max(0, N_ASIN - (MAIN_ASIN?1:0));
const B0 = (D.meta.captured_at||'').slice(0,10);
const D0 = B0.slice(5); // '09-04'
const usd = v => (v==null||isNaN(v)) ? '--' : '$'+Number(v).toFixed(2);
const fmtVol = v => v ? (v>=1000000?(v/1000000).toFixed(1)+'M':v>=1000?(v/1000).toFixed(0)+'K':v) : '--';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const charts = {};
function destroyChart(id){ if(charts[id]){ try{charts[id].destroy()}catch(e){} delete charts[id]; } }
function destroyAll(){ Object.keys(charts).forEach(k=>{ try{charts[k].destroy()}catch(e){} }); for(const k in charts) delete charts[k]; }
function rankColor(r){ return r<=3?'rk1':r<=8?'rk2':r<=20?'rk3':r<=50?'rk4':'rk5'; }
function fmtRank(r){ if(r==null) return '<span class="text-slate-300">—</span>'; return '<span class="rankcell '+rankColor(r)+'">#'+r+'</span>'; }

let current = 'dashboard';
let currentParams = null;

function toast(msg){
  const w=document.getElementById('toast-wrap');
  const t=document.createElement('div');
  t.className='card px-4 py-2.5 text-[13px] text-slate-700 shadow-lg';t.textContent=msg;
  w.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function sugState(){ try{ return JSON.parse(localStorage.getItem('monitor_sug_state')||'{}'); }catch(e){ return {}; } }
function setSug(i,state){
  const s=sugState(); s['s'+i]=state; localStorage.setItem('monitor_sug_state', JSON.stringify(s));
  toast(state==='adopted'?'已记录：采纳建议 → 创建版本记录（未自动修改 Amazon）':(state==='watch'?'已记录：继续观察':'已记录：忽略此建议'));
  goto('suggest');
}
/* 竞品评分（确定性可解释，前端计算，口径标注在页面） */
function avgPriceNow(){ const dayMap={}; D.asins.forEach(a=>a.price7.forEach(p=>{ (dayMap[p.d]=dayMap[p.d]||[]).push(p.v); })); const ds=Object.keys(dayMap).sort(); const last=dayMap[ds[ds.length-1]]; return last.reduce((s,v)=>s+v,0)/last.length; }
function scoreOf(a){
  const k=D.per_asin[a.asin]||{};
  let s=0;
  s+=Math.min(20,(a.rating||0)*4);
  s+=Math.min(15,(k.t10||0)*1.2);
  s+=Math.min(10,Math.max(0,((k.t20||0)-(k.t10||0)))*0.5);
  s+=Math.min(10,a.rank!=null?Math.max(0,20-a.rank):0);
  s+=Math.min(10,a.reviews?Math.log10(a.reviews)*2.2:0);
  s+=a.fba?6:0;
  s+=a.buybox==='Amazon'?6:2;
  const avg=avgPriceNow(); if(a.price&&a.price<avg)s+=Math.min(9,(avg-a.price)/avg*40);
  return Math.min(99.9,Math.round(s*10)/10);
}
function compParts(a){
  const total=scoreOf(a)||1;
  const k=D.per_asin[a.asin]||{};
  const avg=avgPriceNow();
  const raw=[
    Math.min(30,(a.brand?18:0)+(a.title?6:0)),
    Math.min(30,(k.t10||0)*1.5),
    Math.min(30,(D.pool.filter(p=>p.per[a.asin]&&p.per[a.asin].p).length||0)*1.2),
    Math.min(30,(k.t20||0)*1.2),
    Math.min(30,a.rank!=null?Math.max(0,25-a.rank)*1.1:0),
    Math.min(30,a.price?Math.max(0,30-Math.abs(a.price-avg)*3):0),
    Math.min(30,a.buybox==='Amazon'?30:18)];
  const sum=raw.reduce((s,v)=>s+v,0)||1;
  return raw.map(v=>+((v/sum)*total).toFixed(1));
}
function colorOf(asin){ const pal=['#4f46e5','#ef4444','#f59e0b','#0ea5e9','#10b981','#8b5cf6','#f43f5e','#14b8a6','#6366f1','#e11d48','#059669','#d97706','#7c3aed']; const i=ASIN_ORDER.indexOf(asin); return pal[i>=0?i%pal.length:0]||'#6366f1'; }
function hexA(hex,a){ const h=hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return 'rgba('+r+','+g+','+b+','+a+')'; }
/* 价格序列（price7 存月度均价快照）按时间窗聚合成平均线 */
function avgSeries(){ const dayMap={}; D.asins.forEach(a=>a.price7.forEach(p=>{(dayMap[p.d]=dayMap[p.d]||[]).push(p.v);})); const all=Object.keys(dayMap).sort(); const days=all.slice(-12); return {days, avg:days.map(d=>+(dayMap[d].reduce((s,v)=>s+v,0)/dayMap[d].length).toFixed(2))}; }

/* ==================== 页面渲染器 ==================== */
const PAGES = {};

/* ---------- Dashboard ---------- */
PAGES.dashboard = {
  charts: { trend: c=>{}} , // placeholder replaced below
  render(el){
    const t=D.totals;
    const rising=D.changes.filter(x=>x.after>x.before).length;
    const falling=D.changes.filter(x=>x.after<x.before).length;
    const msAll=[...new Set(D.asins.flatMap(a=>a.price7.map(p=>p.d)))].sort();
    const last2=msAll.length>=2?msAll.slice(-2).map(m=>m.slice(5)).join('→'):'--';
    el.innerHTML=`
    <div class="mb-4">
      <div class="text-[16px] font-bold text-slate-900">运营总览</div>
      <div class="text-[12px] text-slate-500">今天最值得关注的市场变化、排名风险和可执行动作。</div>
    </div>
    <div class="grid grid-cols-4 gap-3 mb-4">
      ${stat('监控 ASIN', t.asins, '已核验 · 自有 '+((D.meta.own_count||1))+' + 竞品 '+N_COMP)}
      ${stat('核心关键词', t.words, '首轮反查 '+D.meta.topk+'/ASIN 去重')}
      ${stat('Top 10 词', t.top10_words, '≥1 竞品进入首页前 10')}
      ${stat('Top 20 词', t.top20_words, '≥1 竞品进入前 20')}
      ${stat('Top 50 词', t.top50_words, '≥1 竞品进入前 50')}
      ${stat('直接竞争词', t.pool, '≥2 竞品同词有自然位')}
      ${stat('月度上行', rising, last2+' 月均价上行 '+rising+' 条')}
      ${stat('月度下行', falling, last2+' 月均价下行 '+falling+' 条')}
    </div>
    <div class="grid grid-cols-3 gap-4 mb-4">
      <div class="card col-span-2 p-4">
        <div class="flex items-center justify-between mb-1">
          <div class="text-[13.5px] font-bold text-slate-800">竞品售价走势 <span class="text-[11px] font-normal text-slate-400 ml-1">月度均价 · 近 12 个月窗口</span></div>
          <span class="pill pill-blue">基线 ${B0}</span>
        </div>
        <div class="text-[10.5px] text-slate-400 mb-2">Sorftime ProductTrend 月度均价（产品上架不足 12 个月按实际窗口展示）；日级价格随每日快照累积</div>
        <div style="position:relative;height:210px"><canvas id="ch-trend"></canvas></div>
      </div>
      <div class="card p-4">
        <div class="text-[13.5px] font-bold text-slate-800 mb-1">AI 今日重点 <span class="text-[10px] font-normal text-slate-400 ml-1">Evidence-first</span></div>
        <div class="space-y-2.5" id="ai-signals"></div>
      </div>
    </div>
    <div class="card p-4">
      <div class="flex justify-between items-center mb-2">
        <div class="text-[13.5px] font-bold text-slate-800">重点竞品 <span class="text-[11px] font-normal text-slate-400 ml-1">按类目排名排序 · 首轮基线 ${B0}</span></div>
        <button class="btn btn-sm" onclick="goto('data')">查看全部 →</button>
      </div>
      <table class="w-full"><thead><tr><th>ASIN</th><th>竞品</th><th>Score</th><th>价格</th><th>Rating</th><th>Review</th><th>BSR</th><th>FBA</th><th></th></tr></thead>
      <tbody id="tbl-top"></tbody></table>
    </div>`;
    const sg=document.getElementById('ai-signals');
    D.signals.forEach(s=>{
      const d=document.createElement('div');
      d.className='rounded-lg border p-2.5 '+(s.lvl==='P1'?'border-red-100 bg-red-50/50':'border-amber-100 bg-amber-50/50');
      d.innerHTML=`<div class="flex items-center gap-1.5 mb-1"><span class="text-[11.5px] font-bold text-slate-700">${esc(s.title)}</span><span class="pill ${s.lvl==='P1'?'pill-p1':'pill-p2'}">${s.lvl}</span></div>
        <div class="text-[11px] text-slate-600 mb-1">${esc(s.reason)}</div>
        <div class="text-[10px] src-tag">证据：${esc(s.evidence)}</div>`;
      sg.appendChild(d);
    });
    const tb=document.getElementById('tbl-top');
    [...D.asins].sort((a,b)=>(a.rank||99)-(b.rank||99)).forEach(a=>{
      tb.insertAdjacentHTML('beforeend',`<tr>
        <td class="font-mono text-[11.5px]">${a.asin}</td>
        <td><div class="font-semibold text-slate-800">${BRAND_SHORT[a.asin]}</div><div class="text-[10.5px] text-slate-400 max-w-[200px] truncate">${esc(a.brand)} · ${esc(a.cat||'')}</div></td>
        <td><span class="font-bold text-indigo-600">${scoreOf(a).toFixed(1)}</span></td>
        <td>${usd(a.price)}</td><td>${a.rating||'--'} ★</td><td>${fmtVol(a.reviews)}</td><td>#${a.rank??'--'}</td>
        <td>${a.fba?'<span class="pill pill-ok">FBA</span>':'<span class="pill pill-p1">跟</span>'}</td>
        <td><button class="btn btn-sm" onclick="goto('detail',{asin:'${a.asin}'})">详情</button></td></tr>`);
    });
  }
};
PAGES.dashboard.charts = {
  trend(c){ // 竞品售价走势：月度均价，最近 12 个月窗口
    destroyChart('trend');
    const ms=[...new Set(D.asins.flatMap(a=>a.price7.map(p=>p.d)))].sort().slice(-12);
    const mk=a=>ms.map(m=>{const f=a.price7.find(p=>p.d===m); return f?f.v:null;});
    charts['trend']=new Chart(c,{type:'line',data:{labels:ms,datasets:D.asins.map(a=>({label:BRAND_SHORT[a.asin],data:mk(a),borderColor:colorOf(a.asin),backgroundColor:hexA(colorOf(a.asin),0.09),spanGaps:true,tension:.25,pointRadius:2,borderWidth:2}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:10.5},boxWidth:12}}},scales:{y:{ticks:{font:{size:10},callback:v=>'$'+v},title:{display:true,text:'USD',font:{size:10}}},x:{ticks:{font:{size:10}}}}}});
  }
};

/* ---------- 我的产品（自有 ASIN） ---------- */
PAGES.myasin = { render(el){
  const a=ASIN_META[MAIN_ASIN]||D.asins[0];
  if(!a){ el.innerHTML='<div class="card p-8 text-slate-400">未配置自有 ASIN</div>'; return; }
  const k=D.per_asin[a.asin]||{};
  const tierC={}; D.asins.forEach(x=>{ if(x.asin!==MAIN_ASIN) tierC[x.tier]=(tierC[x.tier]||0)+1; });
  const inPool=D.pool.filter(p=>p.per[a.asin]&&p.per[a.asin].p).length;
  const sugN=D.suggestions.filter(s=>s.asin===MAIN_ASIN).length;
  const tiers=Object.entries(tierC).sort((x,y)=>x[0].localeCompare(y[0])).map(([t,n])=>`<span class="pill ${t==='P1'?'pill-p1':'pill-p2'}">${t} × ${n}</span>`).join('');
  el.innerHTML=`<div class="card p-5">
    <div class="flex items-center justify-between mb-4">
      <div class="text-[15px] font-bold text-slate-900">我的产品 <span class="pill pill-blue ml-1">自有 ASIN</span></div>
      <div class="text-[11px] src-tag">项目 ${esc(D.meta.project)} · 快照 ${B0} · sorftime_cli</div>
    </div>
    <div class="grid grid-cols-3 gap-4">
      <div class="col-span-2">
        <div class="rounded-xl border border-slate-200 p-4">
          <div class="flex items-start gap-3">
            <div class="flex-1 min-w-0">
              <div class="font-mono text-[11px] text-indigo-500 mb-1">${a.asin} · ${esc(a.brand)}</div>
              <div class="text-[13.5px] font-bold text-slate-900 leading-snug">${esc(a.title)}</div>
              <div class="text-[10.5px] text-slate-400 mt-1">${esc(a.subcategory||a.cat||'')}（${esc(a.top_category||'')}）</div>
            </div>
            <div class="text-right shrink-0">
              <div class="text-[26px] font-extrabold text-indigo-600">${usd(a.price)}</div>
              <div class="text-[10.5px] text-slate-400">当前实时价</div>
            </div>
          </div>
          <div class="grid grid-cols-6 gap-2 mt-4">
            ${mini('Rating',(a.rating||'--')+' ★')}${mini('Review',fmtVol(a.reviews))}
            ${mini('月销(估)',a.est_month?fmtVol(a.est_month):'--')}${mini('月销额',a.est_amount?usd(a.est_amount):'--')}
            ${mini('子类目排名','#'+(a.rank??'--'))}${mini('FBA',a.fba?'是':'否')}
            ${mini('Buybox',esc((a.buybox||'--').slice(0,14)))}${mini('毛利率',a.gross_profit_rate!=null?a.gross_profit_rate.toFixed(0)+'%':'--')}
            ${mini('上架',a.online_date&&a.online_date!=='Unknown'?a.online_date:'--')}${mini('变体',a.variation_count??'--')}
          </div>
        </div>
        <div class="rounded-xl border border-slate-200 p-4 mt-4">
          <div class="text-[13px] font-bold text-slate-800 mb-1">自动发现竞品池（已完成）</div>
          <div class="text-[11.5px] text-slate-500 mb-2">基于产品边界交叉检索，入池 ${N_COMP} 个竞品：${tiers}</div>
          <div class="text-[11.5px] text-slate-600 leading-relaxed bg-slate-50 rounded-lg p-3"><b>产品边界：</b>${esc(D.meta.boundary||'--')}</div>
        </div>
      </div>
      <div class="space-y-4">
        <div class="rounded-xl border border-slate-200 p-4">
          <div class="text-[12.5px] font-bold text-slate-800 mb-1">自有 ASIN 竞争力</div>
          <div class="text-[30px] font-extrabold text-indigo-600">${scoreOf(a).toFixed(1)}<span class="text-[11px] text-slate-400 font-normal"> /100</span></div>
          <div class="grid grid-cols-3 gap-1.5 mt-3 text-center">
            ${kwStat('自然词',k.org||0)}${kwStat('Top10',k.t10||0)}${kwStat('Top20',k.t20||0)}
            ${kwStat('Top50',k.t50||0)}${kwStat('广告词',k.ad||0)}${kwStat('竞争词池',inPool)}
          </div>
          <div class="mt-3 space-y-1.5 text-[11.5px] border-t border-slate-100 pt-3">
            <div class="flex justify-between"><span class="text-slate-500">关键词缺口（Gap）</span><b class="text-red-500">${D.gaps.length}</b></div>
            <div class="flex justify-between"><span class="text-slate-500">Listing 优化建议</span><b>${sugN}</b></div>
            <div class="flex justify-between"><span class="text-slate-500">价格变化事件</span><b>${D.changes.length}</b></div>

function goto(id,params){
  current=id; currentParams=params||null;
  if(history.replaceState) history.replaceState(null,'','#page='+id);
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===id));
  renderPage();
}

  root.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='page active'; root.appendChild(wrap);
  pg.render(wrap,currentParams);
  // mount charts: pg.charts keyed by chart name; canvas id may be 'ch-<name>'
  if(pg.charts){
    wrap.querySelectorAll('canvas[id]').forEach(cv=>{
      const fn=pg.charts[cv.id]||pg.charts[cv.id.replace(/^ch-/,'')];
      if(fn){ try{ fn(cv); }catch(e){ console.error('chart mount '+cv.id, e); } }
    });
  }
}
/* fix detail charts keyed by canvas ids */
PAGES.detail.charts={score(c){mountScore(c)},p7(c){mountP7(c)}};
function mountScore(c){
  const info=c.closest('.page')._charts; if(!info)return;
  destroyChart('score');
  charts['score']=new Chart(c,{type:'bar',data:{labels:info.partLabels,datasets:[{data:info.parts,backgroundColor:['#6366f1','#8b5cf6','#a855f7','#0ea5e9','#14b8a6','#f59e0b','#f43f5e'].map(x=>hexA(x,0.8)),borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{max:30,ticks:{font:{size:9}}},y:{ticks:{font:{size:9.5}}}}}});
}
function mountP7(c){
  const info=c.closest('.page')._charts; if(!info)return;
  destroyChart('p7');
  const a=info.a;
  const ms=[...new Set((a.price7||[]).map(p=>p.d))].sort().slice(-12);
  const vals=ms.map(m=>{const f=a.price7.find(p=>p.d===m); return f?f.v:null;});
  charts['p7']=new Chart(c,{type:'line',data:{labels:ms,datasets:[{label:a.asin,data:vals,borderColor:'#6366f1',backgroundColor:hexA('#6366f1',0.13),fill:true,spanGaps:true,tension:.25,pointRadius:2.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{font:{size:10},callback:v=>'$'+v}},x:{ticks:{font:{size:10}}}}}});
}

/* ============ init ============ */
(function(){
  document.getElementById('hd-project').textContent=D.meta.project;
  document.getElementById('hd-site').textContent=D.meta.site;
  document.getElementById('hd-status').textContent=D.meta.status;
  document.getElementById('hd-cand').textContent='0';
  document.getElementById('hd-cap').textContent='captured_at '+D.meta.captured_at+' · sorftime_cli · RequestLeft '+RL+' · '+D.meta.project;
  const m=location.hash.match(/page=(\w+)/);
  if(m&&PAGES[m[1]]) current=m[1];
  buildNav();
  renderPage();
})();
</script>
